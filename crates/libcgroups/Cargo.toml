[package]
name = "libcgroups"
version = "0.8.0" # MARK: Version
description = "Library for cgroup"
license = "Apache-2.0"
repository = "https://github.com/youki-dev/youki"
homepage = "https://youki-dev.github.io/youki/"
readme = "README.md"
authors = ["youki team"]
edition = "2024"
rust-version = "1.85.0"
autoexamples = true
keywords = ["youki", "container", "cgroups"]

[features]
default = ["v1", "v2", "systemd"]
v1 = []
v2 = []
# The systemd manager attaches the eBPF device filter itself, over the one systemd derives
# from DeviceAllow, so "systemd" includes it. This makes "systemd cgroupsv2_devices" the same
# build as "systemd"; scripts/features_test.sh lists only the latter.
systemd = ["systemd_base", "cgroupsv2_devices"]
# The systemd manager without the eBPF device filter, for builds that cannot take libbpf's C
# dependencies. Device rules are then expressed only through DevicePolicy/DeviceAllow, and a
# rule set containing a deny rule, which DeviceAllow cannot express, is refused.
systemd_base = ["v2", "nix/socket", "nix/uio"]
cgroupsv2_devices = ["rbpf", "libbpf-sys", "errno", "libc", "nix/dir"]

[dependencies]
nix = { workspace = true, features = ["signal", "user", "fs"] }
procfs = { workspace = true }
pathrs = { workspace = true }
oci-spec = { workspace = true }
fixedbitset = { workspace = true }
serde = { workspace = true, features = ["derive"] }
rbpf = { workspace = true, optional = true }
libbpf-sys = { workspace = true, optional = true }
errno = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }

[dev-dependencies]
anyhow = { workspace = true }
oci-spec = { workspace = true, features = ["proptests"] }
quickcheck = { workspace = true }
mockall = { workspace = true, features = [] }
clap = { workspace = true, features = ["std", "color", "help", "usage", "error-context", "suggestions"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
env_logger = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
